<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: {{PAGE_SIZE}};
    margin: {{MARGIN}};
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #1B2233;
    font: 400 {{FONT_SIZE}}/1.6 {{BODY_FONT}}, system-ui, -apple-system, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .doc h1, .doc h2, .doc h3, .doc h4 {
    font-family: {{HEADING_FONT}}, system-ui, -apple-system, sans-serif;
    color: {{ACCENT_COLOR}};
    line-height: 1.2;
    break-after: avoid;
  }
  .doc h1 {
    font-size: 2.15em;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0 0 0.6em;
    border-bottom: {{HEADING_BORDER}};
    padding-bottom: 0.35em;
  }
  .doc h2 { font-size: 1.4em; font-weight: 700; margin: 1.45em 0 0.4em; }
  .doc h3 { font-size: 1.1em; font-weight: 600; margin: 1.1em 0 0.3em; color: #1B2233; }
  .doc p { margin: 0.6em 0; }
  .doc ul, .doc ol { padding-left: 1.35em; margin: 0.6em 0; }
  .doc li { margin: 0.2em 0; }
  .doc a { color: #3F73E6; text-decoration: underline; }
  .doc blockquote {
    border-left: 4px solid #548CFF;
    background: #F5F8FF;
    margin: 1em 0;
    padding: 0.5em 1em;
    color: #2D3748;
    border-radius: 0 6px 6px 0;
    break-inside: avoid;
  }
  .doc code {
    font: 0.85em ui-monospace, Consolas, monospace;
    background: #EEF1F6;
    padding: 0.1em 0.3em;
    border-radius: 3px;
  }
  .doc pre {
    background: #EEF1F6;
    padding: 0.8em 1em;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    break-inside: avoid;
  }
  .doc pre code { background: none; padding: 0; }
  .doc hr { border: 0; border-top: 1px solid #D5DBE5; margin: 1.4em 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 1em 0; break-inside: avoid; }
  .doc th, .doc td { border: 1px solid #D5DBE5; padding: 0.5em 0.75em; text-align: left; }
  .doc th { background: #EEF4FF; color: #1B2233; font-weight: 700; }
</style>
</head>
<body>
  <article class="doc">{{CONTENT}}</article>
</body>
</html>
