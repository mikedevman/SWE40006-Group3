<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: {{PAGE_SIZE}};
    margin: {{MARGIN}};
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #1B2233;
    font: 400 {{FONT_SIZE}}/1.65 {{BODY_FONT}}, Georgia, "Times New Roman", serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .doc h1, .doc h2, .doc h3, .doc h4 {
    font-family: {{HEADING_FONT}}, Georgia, "Times New Roman", serif;
    color: {{ACCENT_COLOR}};
    line-height: 1.25;
    break-after: avoid;
  }
  .doc h1 {
    font-size: 2.05em;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.6em;
    border-bottom: {{HEADING_BORDER}};
    padding-bottom: 0.35em;
  }
  .doc h2 { font-size: 1.35em; font-weight: 600; margin: 1.5em 0 0.45em; }
  .doc h3 { font-size: 1.1em; font-weight: 600; font-style: italic; margin: 1.2em 0 0.3em; }
  .doc p { margin: 0.7em 0; text-align: justify; }
  .doc ul, .doc ol { padding-left: 1.4em; margin: 0.65em 0; }
  .doc li { margin: 0.25em 0; }
  .doc a { color: #1B2233; text-decoration: underline; }
  .doc blockquote {
    border-left: 2px solid {{ACCENT_COLOR}};
    margin: 1.1em 0;
    padding: 0.2em 1.1em;
    color: #3D4859;
    font-style: italic;
    break-inside: avoid;
  }
  .doc code {
    font: 0.85em ui-monospace, Consolas, monospace;
    background: #EEF1F6;
    padding: 0.1em 0.3em;
    border-radius: 3px;
  }
  .doc pre {
    background: #EEF1F6;
    padding: 0.8em 1em;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    break-inside: avoid;
  }
  .doc pre code { background: none; padding: 0; }
  .doc hr { border: 0; border-top: 1px solid #C6CDD9; margin: 1.6em 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 1.1em 0; break-inside: avoid; }
  .doc th, .doc td { border: 1px solid #C6CDD9; padding: 0.45em 0.7em; text-align: left; }
  .doc th { background: #F4F6FA; font-weight: 600; }
</style>
</head>
<body>
  <article class="doc">{{CONTENT}}</article>
</body>
</html>
