<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: {{PAGE_SIZE}};
    margin: {{MARGIN}};
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #1B2233;
    font: 400 {{FONT_SIZE}}/1.45 {{BODY_FONT}}, system-ui, -apple-system, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .doc h1, .doc h2, .doc h3, .doc h4 {
    font-family: {{HEADING_FONT}}, system-ui, -apple-system, sans-serif;
    color: {{ACCENT_COLOR}};
    line-height: 1.15;
    break-after: avoid;
  }
  .doc h1 {
    font-size: 1.9em;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 0.35em;
    border-bottom: {{HEADING_BORDER}};
    padding-bottom: 0.2em;
  }
  .doc h2 {
    font-size: 1.15em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid #D5DBE5;
    padding-bottom: 0.2em;
    margin: 1em 0 0.35em;
  }
  .doc h3 { font-size: 1em; font-weight: 600; margin: 0.7em 0 0.2em; }
  .doc p { margin: 0.35em 0; }
  .doc ul, .doc ol { padding-left: 1.2em; margin: 0.35em 0; }
  .doc li { margin: 0.15em 0; }
  .doc a { color: #3F73E6; text-decoration: none; }
  .doc blockquote {
    border-left: 3px solid {{ACCENT_COLOR}};
    margin: 0.6em 0;
    padding: 0.1em 0.8em;
    color: #4A5568;
    break-inside: avoid;
  }
  .doc code {
    font: 0.85em ui-monospace, Consolas, monospace;
    background: #EEF1F6;
    padding: 0.05em 0.25em;
    border-radius: 3px;
  }
  .doc pre {
    background: #EEF1F6;
    padding: 0.6em 0.8em;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    break-inside: avoid;
  }
  .doc pre code { background: none; padding: 0; }
  .doc hr { border: 0; border-top: 1px solid #D5DBE5; margin: 0.9em 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 0.6em 0; break-inside: avoid; }
  .doc th, .doc td { border: 1px solid #D5DBE5; padding: 0.35em 0.55em; text-align: left; }
  .doc th { background: #F4F6FA; font-weight: 600; }
</style>
</head>
<body>
  <article class="doc">{{CONTENT}}</article>
</body>
</html>
