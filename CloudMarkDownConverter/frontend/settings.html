<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings – MarkFlow</title>
<script>(()=>{try{const t=JSON.parse(localStorage.getItem('mf-set')||'{}').theme||'system';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{cloud:'#FDFDFE',ink:'#0B0F1A',verm:'#FF3D17',flow:{DEFAULT:'#548CFF',600:'#3F73E6'}}}}}</script>
<style>
body{font-family:Inter,system-ui,sans-serif}
.doc{background:#fff;color:#1B2233;width:794px;min-height:1123px;padding:var(--m,72px);font:400 var(--sz,11pt)/1.6 var(--bf,Inter),system-ui,sans-serif;transform-origin:top left;box-shadow:0 1px 2px rgba(0,0,0,.15),0 16px 40px -16px rgba(0,0,0,.35)}
.doc h1,.doc h2,.doc h3{font-family:var(--hf,Inter),system-ui,sans-serif;color:var(--ac,#0B0F1A);line-height:1.2;break-after:avoid}
.doc h1{font-size:2.1em;font-weight:800;letter-spacing:-.03em;margin:0 0 .5em;border-bottom:var(--hb,0);padding-bottom:.3em}
.doc h2{font-size:1.4em;font-weight:700;margin:1.4em 0 .4em}.doc h3{font-size:1.1em;font-weight:600;margin:1.1em 0 .3em}
.doc p{margin:.6em 0}.doc ul,.doc ol{padding-left:1.3em;margin:.6em 0}.doc ul{list-style:disc}.doc ol{list-style:decimal}
.doc a{color:#3F73E6}.doc blockquote{border-left:3px solid var(--ac,#0B0F1A);margin:1em 0;padding:.1em 1em;color:#4A5568;break-inside:avoid}
.doc code{font:.85em ui-monospace,Consolas,monospace;background:#EEF1F6;padding:.1em .3em;border-radius:3px}
.doc pre{background:#EEF1F6;padding:.8em 1em;border-radius:6px;white-space:pre-wrap;break-inside:avoid}.doc pre code{background:none;padding:0}
.doc hr{border:0;border-top:1px solid #D5DBE5;margin:1.4em 0}
.doc table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.94em}
.doc th,.doc td{border:1px solid #D5DBE5;padding:.45em .65em;text-align:left}
.doc th{background:rgba(15,23,42,.04);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="h-full bg-cloud text-ink antialiased dark:bg-ink dark:text-cloud">

<div class="flex h-full">
  <div id="sbb" class="fixed inset-0 z-30 hidden bg-black/40 md:hidden"></div>
  <aside id="sb" class="fixed inset-y-0 left-0 z-40 flex w-60 -translate-x-full flex-col border-r border-black/10 bg-cloud p-4 transition-transform md:static md:translate-x-0 dark:border-white/10 dark:bg-ink">
    <a href="index.html" class="mb-6 flex items-center gap-2 px-2 font-bold"><span class="grid h-7 w-7 place-items-center rounded-lg bg-flow text-ink"><i data-lucide="file-down" class="h-4 w-4"></i></span>MarkFlow</a>
    <nav class="space-y-1 text-sm font-medium" aria-label="App">
      
        <a href="workspace.html"  class="flex items-center gap-3 rounded-lg px-3 py-2 transition text-black/60 hover:bg-black/5 dark:text-white/60 dark:hover:bg-white/10"><i data-lucide="pen-line" class="h-4 w-4"></i>Workspace</a>
      
        <a href="templates.html"  class="flex items-center gap-3 rounded-lg px-3 py-2 transition text-black/60 hover:bg-black/5 dark:text-white/60 dark:hover:bg-white/10"><i data-lucide="layout-template" class="h-4 w-4"></i>Templates</a>
      
        <a href="export.html"  class="flex items-center gap-3 rounded-lg px-3 py-2 transition text-black/60 hover:bg-black/5 dark:text-white/60 dark:hover:bg-white/10"><i data-lucide="file-output" class="h-4 w-4"></i>Export</a>
      
        <a href="documents.html"  class="flex items-center gap-3 rounded-lg px-3 py-2 transition text-black/60 hover:bg-black/5 dark:text-white/60 dark:hover:bg-white/10"><i data-lucide="folder" class="h-4 w-4"></i>My documents</a>
      
        <a href="settings.html"  aria-current="page"  class="flex items-center gap-3 rounded-lg px-3 py-2 transition bg-flow/20"><i data-lucide="settings" class="h-4 w-4"></i>Settings<span class="ml-auto h-1.5 w-1.5 rounded-full bg-verm"></span></a>
      
    </nav>
    <div class="mt-auto border-t border-black/10 pt-4 text-sm font-medium dark:border-white/10">
      <button data-theme-toggle class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-black/60 transition hover:bg-black/5 dark:text-white/60 dark:hover:bg-white/10" aria-label="Toggle light or dark mode"><i data-lucide="sun-moon" class="h-4 w-4"></i>Toggle theme</button>
    </div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 shrink-0 items-center gap-3 border-b border-black/10 px-4 md:hidden dark:border-white/10"><button id="sbo" class="rounded-lg p-2 hover:bg-black/5 dark:hover:bg-white/10" aria-label="Open menu"><i data-lucide="menu" class="h-5 w-5"></i></button><span class="font-semibold">Settings</span></header>
    <main class="min-h-0 flex-1 overflow-auto">

<div class="mx-auto max-w-3xl space-y-6 p-5 sm:p-8">
  <h1 class="text-2xl font-bold tracking-tight">Settings</h1>
  <section class="rounded-2xl border border-black/10 p-5 dark:border-white/10"><h2 class="font-semibold">Appearance</h2>
    <fieldset class="mt-3 flex flex-wrap gap-3"><legend class="sr-only">Theme</legend>
    <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-black/15 px-4 py-2 text-sm has-[:checked]:border-flow has-[:checked]:bg-flow/15 dark:border-white/20"><input type="radio" name="theme" value="light" class="accent-[#548CFF]">Light</label><label class="flex cursor-pointer items-center gap-2 rounded-lg border border-black/15 px-4 py-2 text-sm has-[:checked]:border-flow has-[:checked]:bg-flow/15 dark:border-white/20"><input type="radio" name="theme" value="dark" class="accent-[#548CFF]">Dark</label><label class="flex cursor-pointer items-center gap-2 rounded-lg border border-black/15 px-4 py-2 text-sm has-[:checked]:border-flow has-[:checked]:bg-flow/15 dark:border-white/20"><input type="radio" name="theme" value="system" class="accent-[#548CFF]">Match system</label></fieldset></section>
  <section class="rounded-2xl border border-black/10 p-5 dark:border-white/10"><h2 class="font-semibold">Editor</h2>
    <div class="mt-3 grid gap-4 sm:grid-cols-2"><div><label for="fs" class="mb-1 block text-sm font-medium">Font size</label><select id="fs" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm dark:border-white/25 dark:bg-ink"><option value="12">12 px</option><option value="13">13 px</option><option value="14">14 px</option><option value="16">16 px</option><option value="18">18 px</option></select></div>
    <div class="space-y-2 pt-6 text-sm"><label class="flex items-center gap-2"><input type="checkbox" id="wrap" class="h-4 w-4 accent-[#548CFF]">Wrap long lines</label><label class="flex items-center gap-2"><input type="checkbox" id="spell" class="h-4 w-4 accent-[#548CFF]">Check spelling</label></div></div></section>
  <section class="rounded-2xl border border-black/10 p-5 dark:border-white/10"><h2 class="font-semibold">PDF defaults</h2>
    <div class="mt-3 grid gap-4 sm:grid-cols-3"><div><label for="size" class="mb-1 block text-sm font-medium">Paper size</label><select id="size" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm dark:border-white/25 dark:bg-ink"><option>A4</option><option>Letter</option><option>Legal</option></select></div><div><label for="margin" class="mb-1 block text-sm font-medium">Margins</label><select id="margin" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm dark:border-white/25 dark:bg-ink"><option value="narrow">Narrow</option><option value="normal">Normal</option><option value="wide">Wide</option></select></div><div><label for="tpl" class="mb-1 block text-sm font-medium">Template</label><select id="tpl" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm dark:border-white/25 dark:bg-ink"></select></div></div></section>
  <div class="flex justify-end"><button class="inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-flow disabled:opacity-50 bg-flow text-ink hover:bg-flow-600 hover:text-white" type="button" id="sv">Save changes</button></div>
</div>

</main>
  </div>
</div>

<div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex max-w-sm flex-col gap-2" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="markflow.js"></script>

<script>
function fillTemplates(){const el=$('#tpl');el.innerHTML=Object.entries(TPL).map(([k,t])=>`<option value="${k}">${t.n}</option>`).join('');const v=S().tpl;el.value=TPL[v]?v:(el.options[0]?el.options[0].value:'');}
fillTemplates();
const s=S();['fs','size','margin','tpl'].forEach(i=>{const el=$('#'+i),v=String(s[i]);el.value=Array.from(el.options).some(o=>o.value===v)?v:(el.options[0]?el.options[0].value:'');});$('#wrap').checked=Boolean(s.wrap);$('#spell').checked=Boolean(s.spell);(Array.from(document.querySelectorAll('[name=theme]')).find(r=>r.value===s.theme)||$('[name=theme][value="system"]')).checked=true;
$$('[name=theme]').forEach(r=>r.onchange=()=>{setS({theme:r.value});MF.applyTheme()});
$('#sv').onclick=()=>{setS({fs:+$('#fs').value,wrap:$('#wrap').checked,spell:$('#spell').checked,size:$('#size').value,margin:$('#margin').value,tpl:$('#tpl').value});MF.toast('Settings saved in this browser.')};
MF.loadTemplates().then(fillTemplates);
</script>

</body>
</html>
