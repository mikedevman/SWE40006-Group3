<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in – MarkFlow</title>
<script>(()=>{try{const t=JSON.parse(localStorage.getItem('mf-set')||'{}').theme||'system';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{cloud:'#FDFDFE',ink:'#0B0F1A',verm:'#FF3D17',flow:{DEFAULT:'#548CFF',600:'#3F73E6'}}}}}</script>
<style>
body{font-family:Inter,system-ui,sans-serif}
.doc{background:#fff;color:#1B2233;width:794px;min-height:1123px;padding:var(--m,72px);font:400 var(--sz,11pt)/1.6 var(--bf,Inter),system-ui,sans-serif;transform-origin:top left;box-shadow:0 1px 2px rgba(0,0,0,.15),0 16px 40px -16px rgba(0,0,0,.35)}
.doc h1,.doc h2,.doc h3{font-family:var(--hf,Inter),system-ui,sans-serif;color:var(--ac,#0B0F1A);line-height:1.2;break-after:avoid}
.doc h1{font-size:2.1em;font-weight:800;letter-spacing:-.03em;margin:0 0 .5em;border-bottom:var(--hb,0);padding-bottom:.3em}
.doc h2{font-size:1.4em;font-weight:700;margin:1.4em 0 .4em}.doc h3{font-size:1.1em;font-weight:600;margin:1.1em 0 .3em}
.doc p{margin:.6em 0}.doc ul,.doc ol{padding-left:1.3em;margin:.6em 0}.doc ul{list-style:disc}.doc ol{list-style:decimal}
.doc a{color:#3F73E6}.doc blockquote{border-left:3px solid var(--ac,#0B0F1A);margin:1em 0;padding:.1em 1em;color:#4A5568;break-inside:avoid}
.doc code{font:.85em ui-monospace,Consolas,monospace;background:#EEF1F6;padding:.1em .3em;border-radius:3px}
.doc pre{background:#EEF1F6;padding:.8em 1em;border-radius:6px;white-space:pre-wrap;break-inside:avoid}.doc pre code{background:none;padding:0}
.doc hr{border:0;border-top:1px solid #D5DBE5;margin:1.4em 0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}#print-root{display:block}#print-root .doc{transform:none;box-shadow:none;min-height:0;width:100%!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="h-full bg-cloud text-ink antialiased dark:bg-ink dark:text-cloud">

<main class="grid min-h-full place-items-center p-5">
  <div class="w-full max-w-md">
    <a href="index.html" class="mb-6 flex items-center justify-center gap-2 font-bold"><span class="grid h-8 w-8 place-items-center rounded-lg bg-flow text-ink"><i data-lucide="file-down" class="h-4 w-4"></i></span>MarkFlow</a>
    <div class="rounded-2xl border border-black/10 p-7 shadow-sm dark:border-white/10">
      <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
      <p class="mt-1 text-sm text-black/60 dark:text-white/60">Demo only. No account is created or checked.</p>
      <form id="f" novalidate class="mt-6 space-y-4" data-reg="0">
        
          <div>
            <label for="email" class="mb-1 block text-sm font-medium">Email</label>
            <div class="relative">
              <input id="email" name="email" type="email" autocomplete="email" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm outline-none focus:border-flow focus:ring-2 focus:ring-flow/40 aria-[invalid=true]:border-verm dark:border-white/25">
              
            </div>
            <p id="e-email" class="mt-1 hidden text-sm text-verm"></p>
          </div>
        
          <div>
            <label for="password" class="mb-1 block text-sm font-medium">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" class="w-full rounded-lg border border-black/20 bg-transparent px-3 py-2 text-sm outline-none focus:border-flow focus:ring-2 focus:ring-flow/40 aria-[invalid=true]:border-verm dark:border-white/25">
              <button type="button" data-eye="password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded p-1 text-black/50 hover:text-ink dark:text-white/50 dark:hover:text-cloud" aria-label="Show password"><i data-lucide="eye" class="h-4 w-4"></i></button>
            </div>
            <p id="e-password" class="mt-1 hidden text-sm text-verm"></p>
          </div>
        
        
        <div class="flex items-center justify-between text-sm"><label class="flex items-center gap-2"><input type="checkbox" id="remember" class="h-4 w-4 accent-[#548CFF]">Remember me</label><button type="button" id="forgot" class="font-medium text-flow-600 hover:underline dark:text-flow">Forgot password?</button></div>
        
        <button class="inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-flow disabled:opacity-50 bg-flow text-ink hover:bg-flow-600 hover:text-white w-full py-2.5" type="submit" id="go">Log in</button>
      </form>
      <p class="mt-5 text-center text-sm text-black/60 dark:text-white/60">New to MarkFlow? <a class="font-semibold text-flow-600 hover:underline dark:text-flow" href="register.html">Create an account</a></p>
    </div>
  </div>
</main>


<div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex max-w-sm flex-col gap-2" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="markflow.js"></script>

<script>
const f=$('#f'),reg=f.dataset.reg==='1';
const rules={name:v=>v.trim().length>=2||'Enter your full name.',email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||'Enter a valid email address.',password:v=>v.length>=8||'Use at least 8 characters.',confirm:v=>v===f.elements.password.value||'Passwords do not match.'};
function check(n){const el=f.elements[n];if(!el)return true;const r=rules[n](el.value),ok=r===true,e=$('#e-'+n);el.setAttribute('aria-invalid',String(!ok));e.textContent=ok?'':r;e.classList.toggle('hidden',ok);return ok}
['name','email','password','confirm'].forEach(n=>{const el=f.elements[n];if(el){el.addEventListener('blur',()=>check(n));el.addEventListener('input',()=>el.getAttribute('aria-invalid')==='true'&&check(n))}});
$$('[data-eye]').forEach(b=>b.onclick=()=>{const i=f.elements[b.dataset.eye],s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-label',s?'Hide password':'Show password');b.innerHTML='<i data-lucide="'+(s?'eye-off':'eye')+'" class="h-4 w-4"></i>';lucide.createIcons()});
const fg=$('#forgot');if(fg)fg.onclick=()=>MF.toast('Demo only: no reset email is sent.');
f.onsubmit=e=>{e.preventDefault();if(!['name','email','password','confirm'].map(check).every(Boolean)){const bad=f.querySelector('[aria-invalid=true]');bad&&bad.focus();return}
  const b=$('#go');b.disabled=true;b.textContent=reg?'Creating account…':'Logging in…';
  setTimeout(()=>{MF.flash('Demo '+(reg?'sign-up':'login')+' complete. No account was created or checked.');location.href="documents.html"},900)};
</script>

</body>
</html>
